[build]
  publish = "."
  functions = "netlify/functions"

# A apiKey da configuração web do Firebase é pública por definição (vai para o
# navegador de qualquer site Firebase); a proteção dos dados está nas regras do
# Firestore. Libera só esse valor no verificador de segredos do Netlify.
[build.environment]
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyBCS4hCaaYkPOQpS3eO5qrErYU09nLR68s"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# arquivos internos do repositório não devem ser servidos pelo site
[[redirects]]
  from = "/README.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
